<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" font-family="monospace, Consolas, 'Courier New'" font-size="12">

  <!-- ── Background ── -->
  <rect width="1100" height="730" fill="#0d1117" rx="8"/>

  <!-- ══════════════════════════════════════════════════════════
       TITLE
  ══════════════════════════════════════════════════════════ -->
  <text x="550" y="34" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">CTLD — Troop Transport Flows</text>
  <text x="550" y="52" text-anchor="middle" fill="#6e7681" font-size="11">✅ implemented — Feature L (multi-group) · Feature A (parachute) · Feature I (post-spawn route)</text>

  <!-- ══════════════════════════════════════════════════════════
       LEGEND row
  ══════════════════════════════════════════════════════════ -->
  <rect x="20" y="62" width="1060" height="22" fill="#161b22" rx="4"/>
  <text x="30"  y="77" fill="#58a6ff" font-size="11" font-weight="bold">Posé requis:</text>
  <rect x="120" y="66" width="12" height="12" fill="#2ea043" rx="2"/>
  <text x="136" y="77" fill="#8b949e" font-size="11">oui</text>
  <rect x="170" y="66" width="12" height="12" fill="#f85149" rx="2"/>
  <text x="186" y="77" fill="#8b949e" font-size="11">non (en vol)</text>
  <text x="268" y="77" fill="#58a6ff" font-size="11" font-weight="bold">TRZ:</text>
  <rect x="298" y="66" width="12" height="12" fill="#d29922" rx="2"/>
  <text x="314" y="77" fill="#8b949e" font-size="11">requise</text>
  <rect x="375" y="66" width="12" height="12" fill="#484f58" rx="2"/>
  <text x="391" y="77" fill="#8b949e" font-size="11">non requise</text>
  <text x="488" y="77" fill="#58a6ff" font-size="11" font-weight="bold">JTAC:</text>
  <rect x="526" y="66" width="12" height="12" fill="#bc8cff" rx="2"/>
  <text x="542" y="77" fill="#8b949e" font-size="11">action JTAC déclenchée</text>
  <text x="700" y="77" fill="#58a6ff" font-size="11" font-weight="bold">ÉTAT résultant →</text>
  <text x="820" y="77" fill="#8b949e" font-size="11">état CTLDTroopGroup après l'opération</text>

  <!-- ══════════════════════════════════════════════════════════
       FLOW 1 — BOARD
  ══════════════════════════════════════════════════════════ -->
  <rect x="20" y="94" width="1060" height="93" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="112" fill="#58a6ff" font-size="13" font-weight="bold">FLOW 1 — Board (embarkFromTroopZone)</text>
  <text x="30" y="127" fill="#6e7681" font-size="10">Charger un groupe depuis une TRZ pickup. Héli posé dans la zone TRZ.</text>

  <!-- Col headers -->
  <text x="30"  y="145" fill="#6e7681" font-size="10">MÉTHODE</text>
  <text x="280" y="145" fill="#6e7681" font-size="10">DÉCLENCHEUR</text>
  <text x="560" y="145" fill="#6e7681" font-size="10">POSÉ</text>
  <text x="620" y="145" fill="#6e7681" font-size="10">TRZ</text>
  <text x="700" y="145" fill="#6e7681" font-size="10">JTAC</text>
  <text x="820" y="145" fill="#6e7681" font-size="10">ÉTAT</text>
  <line x1="20" y1="149" x2="1080" y2="149" stroke="#30363d" stroke-width="0.5"/>

  <!-- Row 1 -->
  <text x="30"  y="165" fill="#e6edf3" font-size="11">menu_ctld (sol)</text>
  <text x="280" y="165" fill="#e6edf3" font-size="11">F10 → Troop Commands → Embark / Extract → Load from TRZ_name → Load [template]</text>
  <rect x="557" y="154" width="14" height="14" fill="#2ea043" rx="2"/>
  <rect x="617" y="154" width="14" height="14" fill="#d29922" rx="2"/>
  <text x="697" y="165" fill="#6e7681" font-size="11">—</text>
  <text x="820" y="165" fill="#e6edf3" font-size="11">TRZ_LOADED</text>

  <text x="30"  y="180" fill="#6e7681" font-size="10">Multi-group : N groupes simultanés si multiGroupTransport=true (capacité cumulative). stock TRZ décrémenté à chaque boarding.</text>

  <!-- ══════════════════════════════════════════════════════════
       FLOW 2 — DISEMBARK (context-sensitive)
  ══════════════════════════════════════════════════════════ -->
  <rect x="20" y="197" width="1060" height="228" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="215" fill="#58a6ff" font-size="13" font-weight="bold">FLOW 2 — Disembark (disembark / parachute)</text>
  <text x="30" y="230" fill="#6e7681" font-size="10">L'action "Disembark Troops" est context-sensitive selon la position de l'héli. "Parachute Troops" disponible en vol.</text>

  <!-- Col headers -->
  <text x="30"  y="248" fill="#6e7681" font-size="10">MÉTHODE</text>
  <text x="280" y="248" fill="#6e7681" font-size="10">DÉCLENCHEUR / CONTEXTE</text>
  <text x="560" y="248" fill="#6e7681" font-size="10">POSÉ</text>
  <text x="620" y="248" fill="#6e7681" font-size="10">TRZ</text>
  <text x="700" y="248" fill="#6e7681" font-size="10">JTAC</text>
  <text x="820" y="248" fill="#6e7681" font-size="10">ÉTAT</text>
  <line x1="20" y1="252" x2="1080" y2="252" stroke="#30363d" stroke-width="0.5"/>

  <!-- Row 2a — sol, no TRZ -->
  <text x="30"  y="268" fill="#e6edf3" font-size="11">2a — disembark sol</text>
  <text x="280" y="268" fill="#e6edf3" font-size="11">F10 → Troop Commands → Disembark Troops   (posé hors TRZ)</text>
  <rect x="557" y="257" width="14" height="14" fill="#2ea043" rx="2"/>
  <rect x="617" y="257" width="14" height="14" fill="#484f58" rx="2"/>
  <rect x="694" y="257" width="14" height="14" fill="#bc8cff" rx="2"/>
  <text x="710" y="268" fill="#bc8cff" font-size="10">startLase×N si hasJtac</text>
  <text x="820" y="268" fill="#e6edf3" font-size="11">DEPLOYED</text>

  <!-- Row 2b — sol, TRZ with flag = EXZ -->
  <text x="30"  y="290" fill="#e6edf3" font-size="11">2b — dispatchToEXZ (auto)</text>
  <text x="280" y="290" fill="#e6edf3" font-size="11">F10 → Troop Commands → Disembark Troops   (posé dans TRZ avec flag)</text>
  <text x="280" y="302" fill="#6e7681" font-size="9">Silencieux : aucun DCS group spawné. Incrémente le flag objectif TRZ. Pas de déploiement visible.</text>
  <rect x="557" y="279" width="14" height="14" fill="#2ea043" rx="2"/>
  <rect x="617" y="279" width="14" height="14" fill="#d29922" rx="2"/>
  <text x="697" y="290" fill="#6e7681" font-size="11">—</text>
  <text x="820" y="290" fill="#e6edf3" font-size="11">DEPLOYED_EXZ</text>

  <!-- Row 2c — sol, TRZ pickup-only = return -->
  <text x="30"  y="318" fill="#e6edf3" font-size="11">2c — returnToTroopZone (auto)</text>
  <text x="280" y="318" fill="#e6edf3" font-size="11">F10 → Troop Commands → Disembark Troops   (posé dans TRZ sans flag)</text>
  <text x="280" y="330" fill="#6e7681" font-size="9">Stock TRZ restauré. Instance CTLDTroopGroup discardée. deregisterJTAC×N déclenché avant.</text>
  <rect x="557" y="307" width="14" height="14" fill="#2ea043" rx="2"/>
  <rect x="617" y="307" width="14" height="14" fill="#d29922" rx="2"/>
  <rect x="694" y="307" width="14" height="14" fill="#bc8cff" rx="2"/>
  <text x="710" y="318" fill="#bc8cff" font-size="10">deregisterJTAC×N</text>
  <text x="820" y="318" fill="#e6edf3" font-size="11">RETURNED_TO_TRZ</text>

  <!-- Row 2d — parachute, in flight -->
  <text x="30"  y="348" fill="#e6edf3" font-size="11">2d — parachute virtuel (Feature A)</text>
  <text x="280" y="348" fill="#e6edf3" font-size="11">F10 → Troop Commands → Parachute Troops / Parachute Group [N]</text>
  <text x="280" y="360" fill="#6e7681" font-size="9">En vol. alt ≥ parachuteMinAltitudeTroops. Dérive individuelle simulée. startLase déclenché au landing.</text>
  <rect x="557" y="337" width="14" height="14" fill="#f85149" rx="2"/>
  <rect x="617" y="337" width="14" height="14" fill="#484f58" rx="2"/>
  <rect x="694" y="337" width="14" height="14" fill="#bc8cff" rx="2"/>
  <text x="710" y="348" fill="#bc8cff" font-size="10">startLase×N au landing</text>
  <text x="820" y="348" fill="#e6edf3" font-size="11">DEPLOYED</text>

  <!-- Feature I note -->
  <rect x="25" y="375" width="1050" height="42" fill="#0d2114" rx="4" stroke="#2ea043" stroke-width="0.5"/>
  <text x="35" y="390" fill="#2ea043" font-size="11" font-weight="bold">Feature I — Route post-dépose</text>
  <text x="195" y="390" fill="#e6edf3" font-size="11">Si specificParams défini dans le template loadableGroups : route auto assignée +2 s après spawn (2a et 2d).</text>
  <text x="35" y="407" fill="#8b949e" font-size="10">gotoNearestWPZ → route vers WPZ la plus proche  |  AttackNearestEnemyOnLos → route vers ennemi LOS ≤ 10 km  |  ROE OPEN_FIRE + ALARM_STATE AUTO</text>

  <!-- ══════════════════════════════════════════════════════════
       FLOW 3 — EXTRACT
  ══════════════════════════════════════════════════════════ -->
  <rect x="20" y="435" width="1060" height="95" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="453" fill="#58a6ff" font-size="13" font-weight="bold">FLOW 3 — Extract (embarkFromField)</text>
  <text x="30" y="468" fill="#6e7681" font-size="10">Récupérer un groupe DEPLOYED au sol. Héli posé dans maxExtractDistance du groupe. DCS group détruit — mémoire préservée.</text>

  <!-- Col headers -->
  <text x="30"  y="485" fill="#6e7681" font-size="10">MÉTHODE</text>
  <text x="280" y="485" fill="#6e7681" font-size="10">DÉCLENCHEUR</text>
  <text x="560" y="485" fill="#6e7681" font-size="10">POSÉ</text>
  <text x="620" y="485" fill="#6e7681" font-size="10">TRZ</text>
  <text x="700" y="485" fill="#6e7681" font-size="10">JTAC</text>
  <text x="820" y="485" fill="#6e7681" font-size="10">ÉTAT</text>
  <line x1="20" y1="489" x2="1080" y2="489" stroke="#30363d" stroke-width="0.5"/>

  <!-- Row -->
  <text x="30"  y="506" fill="#e6edf3" font-size="11">menu_ctld (sol)</text>
  <text x="280" y="506" fill="#e6edf3" font-size="11">F10 → Troop Commands → Embark / Extract → Extract: [group name] (Xm)</text>
  <rect x="557" y="495" width="14" height="14" fill="#2ea043" rx="2"/>
  <rect x="617" y="495" width="14" height="14" fill="#484f58" rx="2"/>
  <rect x="694" y="495" width="14" height="14" fill="#bc8cff" rx="2"/>
  <text x="710" y="506" fill="#bc8cff" font-size="10">deregisterJTAC×N avant destroy</text>
  <text x="820" y="506" fill="#e6edf3" font-size="11">FIELD_LOADED</text>

  <text x="30"  y="522" fill="#6e7681" font-size="10">Préserve uniquement les unités vivantes (_aliveUnits). Poids recalculé. Disembark suivant → spawn des survivants uniquement.</text>

  <!-- ══════════════════════════════════════════════════════════
       SPECIAL EVENTS
  ══════════════════════════════════════════════════════════ -->
  <rect x="20" y="542" width="520" height="50" fill="#2d1b1b" rx="4" stroke="#f85149" stroke-width="0.5"/>
  <text x="30" y="558" fill="#f85149" font-size="11" font-weight="bold">⚠ Transport détruit (S_EVENT_DEAD)</text>
  <text x="30" y="573" fill="#e6edf3" font-size="11">→ deregisterJTAC×N pour tous les groupes à bord (TRZ_LOADED + FIELD_LOADED)</text>
  <text x="30" y="585" fill="#8b949e" font-size="10">Protège contre les JTACs zombies. onDead → cleanupDeadTransports().</text>

  <!-- AI Transport note -->
  <rect x="552" y="542" width="528" height="50" fill="#1c1c2e" rx="4" stroke="#8b949e" stroke-width="0.5"/>
  <text x="562" y="558" fill="#8b949e" font-size="11" font-weight="bold">AI Transport (Feature R)</text>
  <text x="562" y="573" fill="#e6edf3" font-size="11">AIZ_name_[B|R|N]_P_T_stock → pickup sur S_EVENT_LAND en zone P</text>
  <text x="562" y="585" fill="#8b949e" font-size="10">AIZ_D_[G|P|GP] → dropoff sol/parachute/mixte. allowRandomAiTeamPickups=true.</text>

  <!-- ══════════════════════════════════════════════════════════
       STATE MACHINE SUMMARY
  ══════════════════════════════════════════════════════════ -->
  <rect x="20" y="603" width="1060" height="90" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="621" fill="#58a6ff" font-size="12" font-weight="bold">CTLDTroopGroup — State transitions summary</text>

  <!-- Boxes -->
  <rect x="30"  y="631" width="110" height="22" fill="#1f4f2f" rx="3" stroke="#2ea043" stroke-width="1"/>
  <text x="85"  y="646" text-anchor="middle" fill="#2ea043" font-size="10" font-weight="bold">TRZ_LOADED</text>

  <rect x="210" y="631" width="110" height="22" fill="#1a3a5c" rx="3" stroke="#58a6ff" stroke-width="1"/>
  <text x="265" y="646" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">FIELD_LOADED</text>

  <rect x="390" y="631" width="110" height="22" fill="#1a3a5c" rx="3" stroke="#58a6ff" stroke-width="1"/>
  <text x="445" y="646" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">DEPLOYED</text>

  <rect x="570" y="631" width="130" height="22" fill="#2d2d0d" rx="3" stroke="#d29922" stroke-width="1"/>
  <text x="635" y="646" text-anchor="middle" fill="#d29922" font-size="10" font-weight="bold">DEPLOYED_EXZ</text>

  <rect x="770" y="631" width="140" height="22" fill="#2d1b1b" rx="3" stroke="#f85149" stroke-width="1"/>
  <text x="840" y="646" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">RETURNED_TO_TRZ</text>

  <!-- Arrows and labels -->
  <!-- TRZ_LOADED → DEPLOYED (2a/2b sol) -->
  <line x1="140" y1="642" x2="386" y2="642" stroke="#e6edf3" stroke-width="1" marker-end="url(#arr)"/>
  <text x="263" y="638" text-anchor="middle" fill="#6e7681" font-size="9">2a/2d disembark</text>

  <!-- TRZ_LOADED → RETURNED (2c RTB) -->
  <line x1="85" y1="653" x2="85" y2="677" stroke="#e6edf3" stroke-width="1"/>
  <line x1="85" y1="677" x2="840" y2="677" stroke="#e6edf3" stroke-width="1"/>
  <line x1="840" y1="677" x2="840" y2="655" stroke="#e6edf3" stroke-width="1" marker-end="url(#arr)"/>
  <text x="462" y="690" text-anchor="middle" fill="#6e7681" font-size="9">2c returnToTroopZone (landed in pickup-only TRZ)</text>

  <!-- DEPLOYED → DEPLOYED_EXZ (2b EXZ) -->
  <line x1="500" y1="642" x2="566" y2="642" stroke="#e6edf3" stroke-width="1" marker-end="url(#arr)"/>
  <text x="533" y="638" text-anchor="middle" fill="#6e7681" font-size="9">2b EXZ</text>

  <!-- DEPLOYED → FIELD_LOADED (3 extract) -->
  <line x1="445" y1="631" x2="265" y2="655" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr2)"/>
  <text x="345" y="625" fill="#6e7681" font-size="9">3 extract</text>

  <!-- FIELD_LOADED → DEPLOYED (disembark again) -->
  <line x1="320" y1="631" x2="395" y2="631" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr2)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e6edf3"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════════════════════ -->
  <text x="550" y="714" text-anchor="middle" fill="#484f58" font-size="10">CTLD — 2026-06-28</text>

</svg>
