name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:        # manual trigger from the Actions UI

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lua 5.1 syntax check (all src/**/*.lua) — luac5.1 -p (parse-only)
  # Catches constructs invalid in DCS (goto, <const>, integer suffixes…).
  # ─────────────────────────────────────────────────────────────
  lua-lint:
    name: Lua 5.1 Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.1
        run: sudo apt-get install -y lua5.1
      - name: Syntax-check src/ with luac5.1
        run: |
          failed=0; total=0
          while IFS= read -r -d '' f; do
            total=$((total + 1))
            if ! luac5.1 -p "$f" 2>/tmp/luac_err; then
              echo "::error file=$f::$(cat /tmp/luac_err)"
              failed=$((failed + 1))
            fi
          done < <(find src -name "*.lua" -print0)
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed / $total Lua file(s) failed Lua 5.1 syntax check."
            exit 1
          fi
          echo "Lua 5.1 syntax OK — $total file(s) checked."

  # ─────────────────────────────────────────────────────────────
  # Secret scanning — gitleaks (public repo, free). See .gitleaks.toml.
  # ─────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact -v

  # ─────────────────────────────────────────────────────────────
  # ctld-tools web app (Svelte): type-check + vitest. The exe ships this frontend, so a break
  # here reaches Mission Makers; release.yml only builds it, which would not catch a red test.
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Web App (ctld-tools)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ctld-tools/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/ctld-tools/web/package-lock.json
      - run: npm ci
      - name: Type-check (svelte-check + tsc)
        run: npm run check
      - name: Unit + component tests (vitest)
        run: npm test
      - name: Build the bundled frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Merge build — single source of truth: tools/build/merge_CTLD.ps1.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Merge Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ctld-tools (the build embeds the config YAML via `ctld-tools embed`)
        working-directory: tools/ctld-tools
        shell: bash
        run: |
          pip install poetry
          poetry install --without build
      - name: Build CTLD.lua
        run: powershell -ExecutionPolicy Bypass -File tools\build\merge_CTLD.ps1
        shell: pwsh
      - name: Verify output exists and is non-empty
        run: |
          if (-not (Test-Path CTLD.lua)) { Write-Host "::error::CTLD.lua not produced"; exit 1 }
          if ((Get-Item CTLD.lua).Length -eq 0) { Write-Host "::error::CTLD.lua is empty"; exit 1 }
        shell: pwsh
      - name: Build the dev-time asset-check companion
        run: powershell -ExecutionPolicy Bypass -File tools\companion\build_companion.ps1
        shell: pwsh
      - name: Verify companion output
        run: |
          if (-not (Test-Path dist\CTLD_asset_check.lua)) { Write-Host "::error::companion not produced"; exit 1 }
          if ((Get-Item dist\CTLD_asset_check.lua).Length -eq 0) { Write-Host "::error::companion is empty"; exit 1 }
        shell: pwsh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CTLD
          path: |
            CTLD.lua
            dist/CTLD_asset_check.lua
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Run the deliverable. The build job above only weighs it.
  #
  # FIX-BUILT-FILE-DOES-NOT-LOAD: 2.0.0-rc8 was tagged and released with a CTLD.lua that raised
  # during its own main chunk, and passed lua-lint (syntax only, per src/ module), busted (which
  # loads a config first and never loads src/scenes/) and the build job (exists, non-empty). This
  # job judges the merged bytes that ship, downloaded from the build job rather than rebuilt.
  # ─────────────────────────────────────────────────────────────
  smoke:
    name: Built CTLD.lua Loads
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: CTLD
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Load the built CTLD.lua with the DCS stubs
        run: lua5.1 tests/ci/smoke/load_built_ctld.lua CTLD.lua

  # ─────────────────────────────────────────────────────────────
  # busted tests (tests/ci/**/*_spec.lua) with coverage ratchet.
  # DCS API is stubbed in tests/ci/helpers/. Coverage floor only goes up.
  # ─────────────────────────────────────────────────────────────
  busted:
    name: busted Tests
    runs-on: ubuntu-latest
    env:
      # Coverage ratchet floor (%). RULE: only ever increase, never decrease.
      # First measured coverage was 61.56%; floor seeded at measured - ~2.5 (ticket 04).
      COVERAGE_FLOOR: '59'
    steps:
      - uses: actions/checkout@v7
      # No Python here: the round-trip parity oracle (tests/ci/data/config_defaults.json)
      # is committed and read via dkjson; its drift vs the YAML is guarded in python-quality.
      - name: Install Lua + LuaRocks + busted + luacov + dkjson
        run: |
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
          sudo luarocks install busted
          sudo luarocks install luacov
          sudo luarocks install dkjson
      - name: Run busted with coverage
        run: busted --coverage tests/ci/
      - name: Enforce coverage ratchet
        run: |
          luacov
          # The luacov Total line is: "Total  <hits> <missed> <pct>%" — take the last field,
          # tolerant of integer-only percentages and spacing changes.
          total=$(awk '/^Total/ { gsub("%","",$NF); print $NF }' luacov.report.out | tail -1)
          if [ -z "$total" ]; then
            echo "::error::Could not parse coverage total from luacov.report.out"
            tail -20 luacov.report.out || true
            exit 1
          fi
          echo "Coverage: ${total}%  (floor: ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(t >= f) }' || {
            echo "::error::Coverage ${total}% is below the ratchet floor ${COVERAGE_FLOOR}%."
            exit 1
          }

  # ─────────────────────────────────────────────────────────────
  # CHANGELOG guard — a PR that touches src/** must also update CHANGELOG.md.
  # Runs on pull requests only. Escape hatch: add the 'skip-changelog' label
  # to the PR (handled inside the step so the job succeeds rather than being
  # skipped, which keeps required-check semantics predictable).
  # ─────────────────────────────────────────────────────────────
  changelog-guard:
    name: CHANGELOG Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry when src/ changes
        env:
          HAS_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$HAS_SKIP" = "true" ]; then
            echo "skip-changelog label present — guard bypassed."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$changed" | grep -q '^src/'; then
            if ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::This PR modifies src/ but does not update CHANGELOG.md. Add an entry under [Unreleased], or apply the 'skip-changelog' label if the change genuinely needs none."
              exit 1
            fi
            echo "src/ changed and CHANGELOG.md updated — OK."
          else
            echo "No src/ changes — CHANGELOG guard not applicable."
          fi

  # ─────────────────────────────────────────────────────────────
  # i18n dictionary guard — blocks a PR that introduces a ctld.tr()/config-YAML
  # key missing from one or more of the four i18n dictionaries (unconditional,
  # no escape hatch: fixing it costs a local merge_CTLD.ps1 run, no API key
  # required), or that leaves a newly-introduced non-EN entry empty (escape
  # hatch: the 'skip-i18n' label, for contributors without local
  # ANTHROPIC_API_KEY access). Diff-scoped against the PR base, so the
  # pre-existing dictionary debt already on develop never blocks an unrelated
  # PR. Runs on pull requests only. STALE keys are reported by the MISSING
  # dry-run but are not blocking here. See ADR 0013.
  # ─────────────────────────────────────────────────────────────
  i18n-guard:
    name: i18n Dictionary Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for i18n keys missing from a dictionary
        shell: pwsh
        run: |
          $output = & tools/build/generate_i18n_dicts.ps1 2>&1 | Out-String
          Write-Host $output
          if ($output -match "MISSING") {
            Write-Host "::error::This PR introduces i18n key(s) missing from one or more dictionaries. Run tools/build/merge_CTLD.ps1 locally (or generate_i18n_dicts.ps1 -Apply) to add the stubs, then commit the result."
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check for newly-introduced empty i18n entries
        env:
          HAS_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-i18n') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$HAS_SKIP" = "true" ]; then
            echo "skip-i18n label present — empty-stub check bypassed."
            exit 0
          fi
          if ! python tools/build/check_i18n_diff.py "$BASE_SHA"; then
            echo "::error::This PR leaves a newly-introduced i18n entry untranslated. Run tools/build/merge_CTLD.ps1 locally with ANTHROPIC_API_KEY set to translate it, or apply the 'skip-i18n' label if a maintainer will translate it later."
            exit 1
          fi

  # Releases are handled by .github/workflows/release.yml (tag published-v*).
